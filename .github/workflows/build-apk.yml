name: Build Android News APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "the-current-flutter-starter.zip"
      - "scripts/fix_missing_images.py"
      - "scripts/app_branding.py"
      - "scripts/add_skeleton_loading.py"
      - "scripts/add_splash_screen.py"
      - "scripts/diagnose_news_loading.py"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter starter
        run: |
          test -f the-current-flutter-starter.zip
          unzip -o the-current-flutter-starter.zip
          test -f the_current_flutter/pubspec.yaml

      - name: Diagnose news feed loading code
        run: python3 scripts/diagnose_news_loading.py

      - name: Add fallback images for stories without image URLs
        run: python3 scripts/fix_missing_images.py

      - name: Generate Android project files
        working-directory: the_current_flutter
        run: flutter create --platforms=android --org com.thecurrent.news .

      - name: Apply News Feed branding, skeleton loading, and splash screen
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/app_branding.py
          python3 scripts/add_skeleton_loading.py
          python3 scripts/add_splash_screen.py

      - name: Install dependencies
        working-directory: the_current_flutter
        run: flutter pub get

      - name: Build optimized arm64 release APK
        working-directory: the_current_flutter
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Upload optimized APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: news-feed-arm64-release-apk
          path: the_current_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Dart symbol files for crash diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: the-current-news-arm64-symbols
          path: the_current_flutter/build/symbols/
          if-no-files-found: ignore
          retention-days: 14
